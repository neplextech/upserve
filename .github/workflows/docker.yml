name: Container
on:
  pull_request:
    paths:
      [
        "Dockerfile",
        "packages/**",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "package.json",
        "tsconfig.json",
        ".dockerignore",
        ".github/workflows/docker.yml",
      ]
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed image version, e.g. 0.1.0
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment: containers
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && vars.RELEASE_ENABLED == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && vars.RELEASE_ENABLED == 'true' }}
          tags: ghcr.io/neplextech/upserve:${{ inputs.version || 'ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
