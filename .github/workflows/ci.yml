name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:code
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: node scripts/runtime-smoke.mjs && bun scripts/runtime-smoke.mjs
      - run: node scripts/check-packages.mjs
